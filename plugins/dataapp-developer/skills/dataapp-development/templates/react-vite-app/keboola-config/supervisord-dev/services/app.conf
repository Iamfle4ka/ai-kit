; Vite dev server. Named `app`: after a dependency change the base image's
; git-watcher restarts only the program called `app`.
[program:app]
command=/app/node_modules/.bin/vite
directory=/app
autostart=true
autorestart=true
environment=NODE_ENV="development"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
